<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: white;
        }

        header {
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .hero {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .hero h1 {
            font-size: clamp(45px, 8vw, 90px);
            margin-bottom: 20px;
        }

        .hero p {
            color: #aaa;
            font-size: 20px;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 14px 28px;
            border-radius: 12px;
            background: white;
            color: black;
            text-decoration: none;
            font-weight: bold;
        }

        .products {
            padding: 70px 7%;
        }

        .products h2 {
            font-size: 36px;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: #151515;
            border: 1px solid #252525;
            border-radius: 18px;
            padding: 20px;
        }

        .card .image {
            height: 220px;
            background: #222;
            border-radius: 14px;
            margin-bottom: 18px;
        }

        .card h3 {
            margin-bottom: 8px;
        }

        .price {
            color: #aaa;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">NEXORA</div>

    <nav>
        <a href="#">Inicio</a>
        <a href="#productos">Productos</a>
        <a href="#contacto">Contacto</a>
    </nav>
</header>

<section class="hero">
    <div>
        <h1>NEXORA</h1>
        <p>Tecnología que transforma tu experiencia.</p>
        <a href="#productos" class="button">Ver productos</a>
    </div>
</section>

<section class="products" id="productos">
    <h2>Productos destacados</h2>

    <div class="grid">

        <div class="card">
            <div class="image"></div>
            <h3>Producto 1</h3>
            <p class="price">$0</p>
            <a href="#" class="button">Comprar</a>
        </div>

        <div class="card">
            <div class="image"></div>
            <h3>Producto 2</h3>
            <p class="price">$0</p>
            <a href="#" class="button">Comprar</a>
        </div>

        <div class="card">
            <div class="image"></div>
            <h3>Producto 3</h3>
            <p class="price">$0</p>
            <a href="#" class="button">Comprar</a>
        </div>

    </div>
</section>

</body>
</html>
